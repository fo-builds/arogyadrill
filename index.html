<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ArogyaDrill | Adaptive micro-learning for frontline health workers</title>
<meta name="description" content="An offline-first, adaptive drill app that trains ASHA, ANM and nursing students on life-saving maternal, child, nutrition, communicable-disease, emergency and NCD protocols using spaced repetition.">
<meta name="theme-color" content="#0f766e">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230f766e'/><path d='M14 34h10l5-12 8 24 6-12h7' stroke='white' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<style>
:root{
  --bg:#f2f6f5; --card:#ffffff; --ink:#0f2b28; --muted:#5b7470; --line:#dbe7e4;
  --teal:#0f766e; --teal-d:#115e56; --teal-l:#d9f0ec; --amber:#b45309; --amber-l:#fef3c7;
  --red:#b91c1c; --red-l:#fee2e2; --green:#15803d; --green-l:#dcfce7;
  --radius:16px; --shadow:0 1px 2px rgba(15,43,40,.06),0 8px 24px rgba(15,43,40,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans','Noto Sans Devanagari',sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.5;min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 96px}
header.top{position:sticky;top:0;z-index:20;background:rgba(242,246,245,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:12px 16px}
.topin{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.logo svg{flex:none}
.logo .t{font-weight:800;font-size:1.15rem;letter-spacing:-.02em}
.logo .s{font-size:.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.langbtn{border:1.5px solid var(--teal);color:var(--teal);background:#fff;font-weight:700;font-size:.8rem;
  padding:7px 12px;border-radius:999px;cursor:pointer;flex:none}
.langbtn.on{background:var(--teal);color:#fff}
nav.tabs{display:flex;gap:6px;padding:12px 0 4px;overflow-x:auto}
.tab{flex:1;min-width:72px;text-align:center;border:none;background:transparent;color:var(--muted);
  font-weight:700;font-size:.85rem;padding:10px 6px;border-radius:12px;cursor:pointer}
.tab.active{background:var(--teal);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-top:14px}
h2.vh{font-size:1.25rem;margin:18px 0 2px;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:.88rem}
.btn{display:block;width:100%;border:none;border-radius:14px;padding:15px 18px;font-size:1rem;font-weight:800;
  cursor:pointer;text-align:center;letter-spacing:.01em}
.btn.primary{background:var(--teal);color:#fff;box-shadow:0 6px 18px rgba(15,118,110,.28)}
.btn.primary:active{transform:translateY(1px)}
.btn.ghost{background:var(--teal-l);color:var(--teal-d)}
.btn.small{padding:10px 14px;font-size:.88rem;border-radius:10px}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat .n{font-size:1.5rem;font-weight:800;color:var(--teal-d)}
.stat .l{font-size:.7rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.ringwrap{display:flex;align-items:center;gap:16px}
.ring{--p:0;width:84px;height:84px;border-radius:50%;flex:none;
  background:conic-gradient(var(--teal) calc(var(--p)*1%), #e3eeec 0);
  display:grid;place-items:center}
.ring i{width:64px;height:64px;background:var(--card);border-radius:50%;display:grid;place-items:center;
  font-style:normal;font-weight:800;font-size:1.05rem;color:var(--teal-d)}
.topic{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:14px;margin-top:10px;box-shadow:var(--shadow)}
.topic .em{width:44px;height:44px;border-radius:12px;background:var(--teal-l);display:grid;place-items:center;font-size:1.3rem;flex:none}
.topic .tx{flex:1;min-width:0}
.topic .tx b{display:block;font-size:.98rem}
.topic .tx span{font-size:.75rem;color:var(--muted)}
.bar{height:6px;border-radius:99px;background:#e3eeec;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--teal);width:0%}
.chip{display:inline-block;font-size:.68rem;font-weight:800;padding:3px 9px;border-radius:99px;letter-spacing:.02em}
.chip.due{background:var(--amber-l);color:var(--amber)}
.chip.new{background:var(--teal-l);color:var(--teal-d)}
.chip.ok{background:var(--green-l);color:var(--green)}
/* drill overlay */
#drill{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column}
#drill.open{display:flex}
.dhead{display:flex;align-items:center;gap:10px;padding:14px 16px}
.dhead button{border:none;background:transparent;font-size:1.4rem;cursor:pointer;color:var(--muted);padding:4px 8px}
.dprog{flex:1;height:6px;background:#e3eeec;border-radius:99px;overflow:hidden}
.dprog i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .3s}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:.85rem;color:var(--muted);flex:none;width:44px;text-align:right}
.dbody{flex:1;overflow-y:auto;padding:6px 18px 24px;max-width:720px;margin:0 auto;width:100%}
.qtopic{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--teal);margin-bottom:8px}
.qtext{font-size:1.18rem;font-weight:750;line-height:1.45;letter-spacing:-.01em}
.opts{margin-top:18px;display:grid;gap:10px}
.opt{border:2px solid var(--line);background:#fff;border-radius:14px;padding:14px 16px;font-size:.98rem;
  cursor:pointer;text-align:left;line-height:1.4;display:flex;gap:10px;align-items:flex-start}
.opt b.k{flex:none;width:26px;height:26px;border-radius:8px;background:var(--teal-l);color:var(--teal-d);
  display:grid;place-items:center;font-size:.8rem}
.opt.pick{border-color:var(--teal)}
.opt.correct{border-color:var(--green);background:var(--green-l)}
.opt.wrong{border-color:var(--red);background:var(--red-l)}
.opt:disabled{cursor:default}
.fb{margin-top:16px;border-radius:14px;padding:14px 16px;font-size:.92rem;line-height:1.55;display:none}
.fb.good{background:var(--green-l);color:#14532d}
.fb.bad{background:var(--red-l);color:#7f1d1d}
.fb .ttl{font-weight:800;margin-bottom:4px}
.dfoot{padding:12px 16px calc(16px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto;width:100%}
/* log */
.logrow{border-top:1px solid var(--line);padding:12px 2px;font-size:.9rem}
.logrow:first-child{border-top:none}
.logrow .why{color:var(--muted);font-size:.8rem;margin-top:3px}
.hidden{display:none!important}
.about p{margin-top:10px;font-size:.93rem}
.about b{font-weight:800}
.disc{background:var(--amber-l);border:1px solid #f3d9a4;color:#7c4a03;border-radius:12px;padding:12px;font-size:.85rem;margin-top:12px}
footer{text-align:center;color:var(--muted);font-size:.75rem;padding:26px 0 8px}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:10px 18px;border-radius:99px;font-size:.85rem;font-weight:700;z-index:80;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
@media(min-width:560px){ .qtext{font-size:1.3rem} }
</style>
</head>
<body>
<header class="top"><div class="topin">
  <div class="logo">
    <svg width="34" height="34" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#0f766e"/><path d="M14 34h10l5-12 8 24 6-12h7" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div><div class="t">ArogyaDrill</div><div class="s" data-i18n="tag"></div></div>
  </div>
  <button class="langbtn" id="langbtn" onclick="toggleLang()">हिं / EN</button>
</div></header>

<div class="wrap">
<nav class="tabs">
  <button class="tab active" id="tab-today" onclick="show('today')" data-i18n="navToday"></button>
  <button class="tab" id="tab-topics" onclick="show('topics')" data-i18n="navTopics"></button>
  <button class="tab" id="tab-progress" onclick="show('progress')" data-i18n="navProgress"></button>
  <button class="tab" id="tab-about" onclick="show('about')" data-i18n="navAbout"></button>
</nav>

<section id="view-today">
  <h2 class="vh" data-i18n="todayTitle"></h2>
  <div class="sub" id="todaySub"></div>
  <div class="statrow">
    <div class="stat"><div class="n" id="stDue">0</div><div class="l" data-i18n="dueLabel"></div></div>
    <div class="stat"><div class="n" id="stNew">0</div><div class="l" data-i18n="newLabel"></div></div>
    <div class="stat"><div class="n" id="stStreak">0</div><div class="l" data-i18n="streakLabel"></div></div>
  </div>
  <div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
      <div><b data-i18n="goalLabel"></b><div class="sub" data-i18n="goalSub"></div></div>
      <select id="goalSel" onchange="setGoal(this.value)" style="border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font-weight:700;color:var(--teal-d);background:#fff">
        <option>5</option><option selected>10</option><option>15</option><option>20</option>
      </select>
    </div>
  </div>
  <div class="card">
    <button class="btn primary" id="startBtn" onclick="startToday()" data-i18n="startBtn"></button>
    <div class="sub" style="margin-top:10px;text-align:center" id="queueNote"></div>
  </div>
</section>

<section id="view-topics" class="hidden">
  <h2 class="vh" data-i18n="topicsTitle"></h2>
  <div class="sub" data-i18n="topicsSub"></div>
  <div id="topicList"></div>
</section>

<section id="view-progress" class="hidden">
  <h2 class="vh" data-i18n="progTitle"></h2>
  <div class="statrow">
    <div class="stat"><div class="n" id="pgAcc">–</div><div class="l" data-i18n="accLabel"></div></div>
    <div class="stat"><div class="n" id="pgSeen">0</div><div class="l" data-i18n="seenLabel"></div></div>
    <div class="stat"><div class="n" id="pgMast">0</div><div class="l" data-i18n="masteryLabel"></div></div>
  </div>
  <div class="card" style="margin-top:14px"><b data-i18n="mistakesTitle"></b><div id="logList"></div>
    <button class="btn ghost small" style="margin-top:12px" onclick="drillErrors()" id="logBtn" data-i18n="redoBtn"></button>
  </div>
</section>

<section id="view-about" class="hidden about">
  <h2 class="vh" data-i18n="aboutTitle"></h2>
  <div class="card">
    <p data-i18n="aboutP1"></p>
    <p data-i18n="aboutP2"></p>
    <p data-i18n="aboutP3"></p>
    <p data-i18n="aboutP4"></p>
  </div>
  <div class="disc" data-i18n="disc"></div>
  <footer data-i18n="foot"></footer>
</section>
</div>

<div id="drill">
  <div class="dhead">
    <button onclick="endDrill()" aria-label="close">✕</button>
    <div class="dprog"><i id="dprog" style="width:0%"></i></div>
    <div class="timer" id="dtimer">1:00</div>
  </div>
  <div class="dbody">
    <div class="qtopic" id="dqTopic"></div>
    <div class="qtext" id="dqText"></div>
    <div class="opts" id="dqOpts"></div>
    <div class="fb" id="dqFb"></div>
  </div>
  <div class="dfoot"><button class="btn primary hidden" id="nextBtn" onclick="nextQ()"></button></div>
</div>
<div class="toast" id="toast"></div>

<script>
const QUESTIONS = [{"id": "maternal-1", "topic": "maternal", "q": "A pregnant woman is registered at your sub-centre at 9 weeks. As per national guidelines, what is the MINIMUM number of ANC (antenatal) check-ups she should complete?", "o": ["Two", "Three", "Four", "Eight"], "a": 2, "why": "MoHFW/NHM recommends a minimum of 4 ANC visits, with the first within the first 12 weeks. (WHO's 2016 guideline suggests 8 contacts; India's programme minimum remains 4.)", "hi": null}, {"id": "maternal-2", "topic": "maternal", "q": "Which of these is a pregnancy DANGER sign that needs immediate referral?", "o": ["Mild swelling of ankles in the evening", "Blurred vision with severe headache", "Heartburn after meals", "Passing urine more often than usual"], "a": 1, "why": "Severe headache with blurred vision suggests rising blood pressure / pre-eclampsia, which can progress to eclampsia and fits. It needs urgent referral, not observation at home.", "hi": {"q": "गर्भावस्था में निम्न में से कौन-सा खतरे का संकेत है जिसमें तुरंत रेफर करना जरूरी है?", "o": ["शाम को पैरों में हल्की सूजन", "तेज़ सिरदर्द के साथ धुँधला दिखना", "खाने के बाद जलन", "पेशाब अधिक बार आना"], "a": 1, "why": "तेज़ सिरदर्द और धुँधला दिखना बढ़ते ब्लड प्रेशर (प्री-एक्लैम्पसिया) का संकेत है, जो दौरों (एक्लैम्पसिया) तक बढ़ सकता है। तुरंत रेफर करें।"}}, {"id": "maternal-3", "topic": "maternal", "q": "A woman starts bleeding heavily after the placenta is delivered at a home birth. What is the FIRST priority?", "o": ["Give her sweet tea and observe", "Wait 30 minutes to see if bleeding stops", "Arrange immediate referral and keep her warm with blankets", "Give her a bath and change clothes"], "a": 2, "why": "Heavy postpartum bleeding (PPH) is a leading cause of maternal death. The correct action is immediate referral while keeping the woman warm and continuing to massage-support per local protocol.", "hi": null}, {"id": "maternal-4", "topic": "maternal", "q": "When should the FIRST ANC check-up ideally happen?", "o": ["As soon as pregnancy is suspected, within the first 12 weeks", "In the 5th month", "In the 7th month", "Only when problems appear"], "a": 0, "why": "Early registration in the first trimester allows baseline haemoglobin, blood pressure, weight and Td vaccination to be completed in time.", "hi": null}, {"id": "maternal-5", "topic": "maternal", "q": "Under Anemia Mukt Bharat, for how many days should a pregnant woman receive iron-folic acid (IFA) tablets?", "o": ["30 days", "100 days", "180 days", "365 days"], "a": 2, "why": "Pregnant women receive IFA for 180 days (6 months) after the first trimester begins, along with deworming where advised.", "hi": null}, {"id": "maternal-6", "topic": "maternal", "q": "A pregnant woman has never received a Td (tetanus-diphtheria) vaccine and has no records. What should she be given?", "o": ["Nothing during pregnancy", "Two doses of Td at least 4 weeks apart", "One dose at delivery", "Td is only for children"], "a": 1, "why": "For previously unimmunised pregnant women, 2 doses of Td at least 4 weeks apart are recommended, the first as early in pregnancy as possible.", "hi": null}, {"id": "maternal-7", "topic": "maternal", "q": "Why should breastfeeding start within the first hour after birth?", "o": ["It helps the mother sleep", "Colostrum is rich in antibodies and lowers newborn deaths", "It makes the baby hungry later", "There is no particular benefit"], "a": 1, "why": "Early initiation gives colostrum (rich in antibodies), establishes feeding, and is associated with reduced neonatal mortality. Prelacteal feeds like honey or ghutti must be avoided.", "hi": null}, {"id": "maternal-8", "topic": "maternal", "q": "Kangaroo Mother Care (continuous skin-to-skin contact plus exclusive breastfeeding) is mainly recommended for:", "o": ["All healthy term babies only", "Low-birth-weight and preterm babies", "Babies with jaundice only", "Mothers with fever"], "a": 1, "why": "KMC stabilises temperature, breathing and feeding in low-birth-weight (LBW) and preterm babies and is a proven, low-cost intervention.", "hi": null}, {"id": "maternal-9", "topic": "maternal", "q": "At an ANC visit, a woman's haemoglobin is 6.8 g/dL. What should you do?", "o": ["Advise more green leafy vegetables only", "Record it and check again next month", "Refer her urgently for further management", "Nothing; this is normal in pregnancy"], "a": 2, "why": "Hb below 7 g/dL is severe anaemia in pregnancy, a risk factor for death during delivery. Severe anaemia needs urgent referral, not diet advice alone.", "hi": null}, {"id": "maternal-10", "topic": "maternal", "q": "A woman 8 months pregnant tells you the baby's movements have become much less. This means:", "o": ["The baby is sleeping", "She should count again next week", "She needs an immediate check-up, reduced fetal movement is a danger sign", "It is normal in the last month"], "a": 2, "why": "Reduced fetal movement can signal fetal distress and must be checked the same day, not watched at home.", "hi": null}, {"id": "immunization-1", "topic": "immunization", "q": "BCG vaccine is given by which route and at which site?", "o": ["Oral drops, on the tongue", "Intradermal injection, left upper arm", "Subcutaneous injection, right arm", "Intramuscular injection, thigh"], "a": 1, "why": "BCG is a single intradermal dose (0.1 mL in India's UIP) into the left upper arm at birth; a small raised wheal should be visible after correct technique.", "hi": null}, {"id": "immunization-2", "topic": "immunization", "q": "The Hepatitis B birth dose should be given to every newborn within:", "o": ["1 week of birth", "72 hours of birth", "24 hours of birth", "At 6 weeks only"], "a": 2, "why": "India's UIP gives the Hepatitis B birth dose within 24 hours of birth to prevent mother-to-child transmission.", "hi": null}, {"id": "immunization-3", "topic": "immunization", "q": "Which vaccines does a 6-week-old baby receive in one session under UIP?", "o": ["Only BCG", "OPV-1, Pentavalent-1, Rota-1, fIPV-1 and PCV-1", "Only MR and JE", "Measles and Hepatitis B"], "a": 1, "why": "At 6 weeks the baby gets OPV-1, pentavalent-1 (DPT+HepB+Hib), rotavirus-1, fractional IPV-1 and PCV-1, along with a weight check.", "hi": null}, {"id": "immunization-4", "topic": "immunization", "q": "The FIRST dose of Vitamin A solution is given at:", "o": ["Birth", "6 weeks", "9 months along with MR-1", "5 years"], "a": 2, "why": "Vitamin A 1st dose (1 lakh IU) is given at 9 completed months with the MR-1 dose; the 2nd dose (2 lakh IU) at 16-24 months.", "hi": null}, {"id": "immunization-5", "topic": "immunization", "q": "MR-2 (Measles-Rubella second dose) and DPT booster-1 are given at:", "o": ["9 months", "12 months", "16-24 months", "5 years"], "a": 2, "why": "At 16-24 months: MR-2, DPT booster-1, OPV booster, JE-2 in endemic districts and Vitamin A 2nd dose.", "hi": null}, {"id": "immunization-6", "topic": "immunization", "q": "After reconstitution, opened BCG vial must be discarded after:", "o": ["30 minutes", "4 hours", "24 hours", "The end of the session day"], "a": 1, "why": "Reconstituted BCG loses potency and risks contamination; it must be discarded within 4 hours of reconstitution (and at end of session, whichever is earlier).", "hi": null}, {"id": "immunization-7", "topic": "immunization", "q": "The 'shake test' performed on a vial of DPT/HepB/Td is used to detect:", "o": ["Expired vaccine", "Freeze-damaged vaccine", "Overheated vaccine", "A broken seal"], "a": 1, "why": "Adsorbed vaccines frozen by mistake settle as a sediment that does not disperse on shaking. Frozen adsorbed vaccines must never be used.", "hi": null}, {"id": "immunization-8", "topic": "immunization", "q": "OPV and Rotavirus vaccines are administered by which route?", "o": ["Intramuscular", "Intradermal", "Oral", "Subcutaneous"], "a": 2, "why": "Both OPV and rotavirus vaccine are oral vaccines. Correct technique (dropping onto the tongue, no re-feeding immediately) matters for potency and take.", "hi": null}, {"id": "immunization-9", "topic": "immunization", "q": "Among routine UIP vaccines, which is the MOST sensitive to heat?", "o": ["BCG", "OPV (oral polio vaccine)", "Td (tetanus-diphtheria)", "Hepatitis B"], "a": 1, "why": "Live liquid OPV is the most heat-sensitive vaccine in the UIP cold chain, which is why vial monitors and ice-packs discipline matter so much.", "hi": null}, {"id": "immunization-10", "topic": "immunization", "q": "MR-1 (Measles-Rubella first dose) is given at:", "o": ["6 completed weeks", "6 completed months", "9-12 completed months", "2 years"], "a": 2, "why": "MR-1 is given at 9-12 completed months, subcutaneously in the right upper arm.", "hi": null}, {"id": "nutrition-1", "topic": "nutrition", "q": "Exclusive breastfeeding means the baby receives ONLY breast milk (no water, no other food) for the first:", "o": ["1 month", "3 months", "6 months", "12 months"], "a": 2, "why": "WHO and MoHFW recommend exclusive breastfeeding for the first 6 months, with timely complementary feeding started at 6 months.", "hi": {"q": "विशेष रूप से माँ का दूध (पानी सहित कुछ भी नहीं) जन्म के बाद पहले कितने महीने?", "o": ["1 महीना", "3 महीने", "6 महीने", "12 महीने"], "a": 2, "why": "WHO और MoHFW पहले 6 महीने केवल माँ का दूध (exclusive breastfeeding) की सलाह देते हैं; 6 महीने पर ठोस आहार शुरू करें।"}}, {"id": "nutrition-2", "topic": "nutrition", "q": "Complementary (semisolid) foods should begin at 6 months, and breastfeeding should continue:", "o": ["Until 1 year", "Up to 2 years or beyond", "Only until 9 months", "Only while the mother works at home"], "a": 1, "why": "At 6 months start thick complementary feeds 2-3 times a day and continue breastfeeding up to 2 years or beyond.", "hi": null}, {"id": "nutrition-3", "topic": "nutrition", "q": "For a 2-year-old with acute watery diarrhoea and NO danger signs, the standard zinc regimen is:", "o": ["5 mg once", "20 mg daily for 14 days", "20 mg once a week for a month", "Zinc is not useful in diarrhoea"], "a": 1, "why": "Zinc 20 mg/day for 14 days (10 mg/day for infants under 6 months) reduces duration and severity of the episode and protects for the next 2-3 months.", "hi": {"q": "2 साल के बच्चे के पतले दस्त (बिना खतरे के संकेत) में जिंक की खुराक:", "o": ["एक बार 5 मिग्रा", "14 दिन तक प्रतिदिन 20 मिग्रा", "हफ्ते में एक बार एक महीना", "जिंक दस्त में उपयोगी नहीं"], "a": 1, "why": "दस्त में जिंक 20 मिग्रा/दिन, 14 दिन (6 महीने से छोटे शिशु में 10 मिग्रा) से दस्त कम होते हैं और अगले 2-3 महीने बचाव मिलता है।"}}, {"id": "nutrition-4", "topic": "nutrition", "q": "During an episode of diarrhoea, feeding should be:", "o": ["Stopped until stools stop", "Reduced to liquids only", "Continued, with extra fluid and one extra meal after recovery", "Increased only if the child asks"], "a": 2, "why": "Continue feeding and breastfeeding through the illness ('continue feeding' is a core ORS corner rule) and give one extra meal daily for 2 weeks after recovery.", "hi": null}, {"id": "nutrition-5", "topic": "nutrition", "q": "A child's mid-upper-arm circumference (MUAC) measures 11.2 cm. This indicates:", "o": ["Normal nutrition", "Moderate acute malnutrition", "Severe acute malnutrition, needing referral to an NRC/OTC", "Nothing; MUAC is for adults"], "a": 2, "why": "MUAC below 11.5 cm flags severe acute malnutrition (red zone). Such children need urgent referral to a Nutrition Rehabilitation Centre or an outpatient therapeutic programme.", "hi": null}, {"id": "nutrition-6", "topic": "nutrition", "q": "A mother asks how she can get more iron from her mostly plant-based diet. Best advice?", "o": ["Drink tea with every meal", "Pair iron-rich foods with vitamin C sources like amla, guava or lemon; avoid tea/coffee with meals", "Avoid all green vegetables", "Boil vegetables for hours"], "a": 1, "why": "Vitamin C strongly improves non-haem iron absorption, while tea and coffee inhibit it. Simple pairing advice is one of the highest-impact anaemia counselling points.", "hi": null}, {"id": "nutrition-7", "topic": "nutrition", "q": "On a growth chart, a child's weight curve has been FLAT (no gain) for two consecutive months. The ASHA should:", "o": ["Nothing; flat lines are normal", "Assess feeding and illness, counsel the mother, and refer if the child is wasted", "Start a high-dose vitamin course herself", "Tell the family to feed more honey"], "a": 1, "why": "A flat or falling growth curve signals a problem: check feeding practices and illness, counsel, and refer any child with wasting or danger signs.", "hi": null}, {"id": "nutrition-8", "topic": "nutrition", "q": "Deworming (single dose albendazole 400 mg) in pregnancy is safe:", "o": ["In the first trimester", "After the first trimester", "Never in pregnancy", "Only during the last week"], "a": 1, "why": "National guidelines permit deworming after the first trimester as part of anaemia control; it is withheld in early pregnancy.", "hi": null}, {"id": "nutrition-9", "topic": "nutrition", "q": "Using iodised salt in cooking mainly prevents:", "o": ["Anaemia", "Goitre and other iodine-deficiency disorders", "Night blindness", "Diarrhoea"], "a": 1, "why": "Iodised salt prevents iodine-deficiency disorders including goitre and cretinism; test salt with a salt-testing kit during home visits.", "hi": null}, {"id": "nutrition-10", "topic": "nutrition", "q": "The 'first 1000 days' of life refers to:", "o": ["Birth to school age", "Conception to the child's 2nd birthday", "Birth to 6 months", "The first month of life"], "a": 1, "why": "The window from conception to age 2 is when growth and brain development are most sensitive to nutrition, making ANC, exclusive breastfeeding and complementary feeding the highest-value investments.", "hi": null}, {"id": "cd-1", "topic": "cd", "q": "An adult has had a cough for more than 2 weeks. Under NTEP, this should prompt:", "o": ["Cough syrup for 5 days", "Referral for sputum examination / CBNAT testing for TB, free of cost", "Only steam inhalation", "Advice to stop smoking and wait"], "a": 1, "why": "Cough of 2 weeks or more is the TB presumptive case definition. Sputum testing (microscopy/CBNAAT) is free at NTEP facilities; TB treatment is free under Nikshay.", "hi": {"q": "एक वयस्क को 2 हफ्तों से अधिक खांसी है। NTEP के अनुसार क्या करें?", "o": ["5 दिन की खांसी की दवा", "TB की जांच के लिए थूक परीक्षण/CBNAAT (नि:शुल्क) के लिए रेफर करें", "केवल भाप", "धूम्रपान छोड़ने की सलाह देकर इंतज़ार"], "a": 1, "why": "2 हफ्ते या अधिक की खांसी TB के संदिग्ध की परिभाषा है। NTEP केंद्रों पर थूक जांच और TB का इलाज निःशुल्क है (निक्षय)।"}}, {"id": "cd-2", "topic": "cd", "q": "Before treating suspected malaria, the correct step at the field level is:", "o": ["Treat all fevers with antimalarials", "Confirm with a rapid diagnostic test (RDT) or blood slide first", "Give antibiotics instead", "Wait for the fever to settle on its own"], "a": 1, "why": "National malaria policy requires parasitological confirmation (RDT or slide) before treatment wherever possible, with the right drug for the right parasite.", "hi": null}, {"id": "cd-3", "topic": "cd", "q": "Which of the following are dengue WARNING signs that need hospital care?", "o": ["Fever with body ache for 2 days", "Severe abdominal pain, persistent vomiting, bleeding gums, restlessness", "Rash on the trunk only", "Mild runny nose"], "a": 1, "why": "Dengue warning signs appear as fever settles (days 3-7) and mark the critical leaky phase. Any warning sign means immediate hospital referral.", "hi": null}, {"id": "cd-4", "topic": "cd", "q": "An early patch of leprosy typically looks like:", "o": ["An itchy red rash that peels", "A hypopigmented (light) patch with loss of sensation", "A painful blister", "Dark spots on palms"], "a": 1, "why": "Painless, light-coloured patches with reduced sensation are the hallmark; early MDT treatment is free and cures leprosy and prevents deformity.", "hi": null}, {"id": "cd-5", "topic": "cd", "q": "In lymphatic filariasis endemic blocks, the annual Mass Drug Administration (MDA) involves giving:", "o": ["A single annual dose of DEC + albendazole to the whole community", "Daily tablets for a month to children only", "Vaccination twice a year", "Nothing; it is treated only after symptoms appear"], "a": 0, "why": "Annual single-dose DEC+albendazole to the eligible population interrupts transmission; India targets elimination of lymphatic filariasis.", "hi": null}, {"id": "cd-6", "topic": "cd", "q": "Immediately after a dog bite, the FIRST step is:", "o": ["Apply chilli/turmeric to the wound", "Wash the wound with soap and running water for 10-15 minutes, then go for anti-rabies vaccine (and immunoglobulin if category III)", "Tie a tight rope above the wound for an hour", "Ignore it if the dog looks healthy"], "a": 1, "why": "Thorough soap-and-water washing for 10-15 minutes plus prompt ARV (with RIG for category III/transdermal bites) prevents virtually all rabies deaths.", "hi": null}, {"id": "cd-7", "topic": "cd", "q": "As per IMNCI, 'fast breathing' in an infant aged 2 months to 12 months is:", "o": ["30 breaths per minute or more", "40 breaths per minute or more", "50 breaths per minute or more", "60 breaths per minute or more"], "a": 2, "why": "IMNCI cut-offs: 2-12 months, 50 or more breaths/minute; 12-59 months, 40 or more. Fast breathing with other signs means possible pneumonia and referral for assessment.", "hi": null}, {"id": "cd-8", "topic": "cd", "q": "Kala-azar (visceral leishmaniasis) is transmitted by:", "o": ["Aedes mosquitoes", "Sandflies", "Houseflies", "Ticks"], "a": 1, "why": "The sandfly (Phlebotomus argentipes) transmits kala-azar; control includes indoor residual spraying and vector surveillance.", "hi": null}, {"id": "cd-9", "topic": "cd", "q": "Under PPTCT services, every pregnant woman should be:", "o": ["Tested for HIV and syphilis once during ANC", "Tested only if she looks ill", "Vaccinated against HIV", "Told testing is optional and never offered"], "a": 0, "why": "Universal ANC screening for HIV and syphilis links positive mothers to lifelong ART and infant prophylaxis, preventing mother-to-child transmission.", "hi": null}, {"id": "cd-10", "topic": "cd", "q": "Which pair of measures most reliably prevents diarrhoea and cholera in a village?", "o": ["Boiled or chlorinated drinking water, safe sanitation and handwashing", "Daily vitamin drops", "Avoiding bathing in summer", "Eating only cooked food cold"], "a": 0, "why": "Safe water, sanitation and hand hygiene remain the backbone of diarrhoeal disease control, alongside ORS and zinc for treatment.", "hi": null}, {"id": "emergency-1", "topic": "emergency", "q": "A 20-day-old newborn is breathing 68 times per minute. This is:", "o": ["Normal for newborns", "Fast breathing; possible serious infection needing urgent referral", "Nothing to worry about unless the baby cries", "Normal if the baby is feeding"], "a": 1, "why": "In newborns 0-59 days, 60 breaths/minute or more is fast breathing. With poor feeding or lethargy it suggests serious bacterial infection; the baby needs urgent assessment and referral.", "hi": {"q": "20 दिन के नवजात शिशु की सांसें प्रति मिनट 68 बार हैं। यह:", "o": ["नवजातों के लिए सामान्य है", "तेज़ सांसें; संभावित गंभीर संक्रमण, तुरंत रेफर करें", "चिंता की कोई बात नहीं", "बच्चा दूध पी रहा है तो सामान्य"], "a": 1, "why": "0-59 दिन के नवजात में 60 या अधिक सांसें प्रति मिनट तेज़ सांस मानी जाती हैं। दूध न पीना या सुस्ती के साथ यह गंभीर बैक्टीरियल संक्रमण का संकेत है; तुरंत रेफर करें।"}}, {"id": "emergency-2", "topic": "emergency", "q": "A newborn's axillary temperature is 35.8°C. This means:", "o": ["Normal temperature", "Fever", "Hypothermia; warm the baby with skin-to-skin contact immediately", "The thermometer is faulty, always"], "a": 2, "why": "Normal axillary temperature is 36.5-37.5°C. Below 36.5°C is hypothermia: rewarm with skin-to-skin contact, cover the head, ensure feeding, and refer if the baby does not warm up.", "hi": {"q": "नवजात शिशु का बगल का तापमान 35.8°C है। इसका अर्थ:", "o": ["सामान्य तापमान", "बुखार", "हाइपोथर्मिया (ठंड); तुरंत कंगारू केयर (छाती से छूकर) से गर्म करें", "थर्मामीटर खराब है"], "a": 2, "why": "बगल का सामान्य तापमान 36.5-37.5°C है। 36.5°C से कम ठंड है: त्वचा-से-त्वचा संपर्क से गर्म करें, सिर ढकें, दूध पिलाएँ; ठीक न हो तो रेफर करें।"}}, {"id": "emergency-3", "topic": "emergency", "q": "A 3-year-old has a seizure (fits) with fever. What should you do FIRST and always?", "o": ["Put a spoon in the mouth to stop tongue biting", "Place the child on a safe surface, do not restrain, do not put anything in the mouth, and arrange urgent care", "Give the child water to drink", "Shake the child to wake them up"], "a": 1, "why": "Never force anything into the mouth. Protect from injury, time the episode, and get urgent care; with fever think of meningitis or malaria as well as simple febrile fits.", "hi": {"q": "बुखार के साथ 3 साल के बच्चे को दौरे (झटके) आ रहे हैं। सबसे पहले क्या करें?", "o": ["मुँह में चम्मच डालें", "बच्चे को सुरक्षित जगह लिटाएँ, मुँह में कुछ न डालें, न रोकें, और तुरंत उपचार की व्यवस्था करें", "पानी पिलाएँ", "जगाने के लिए हिलाएँ"], "a": 1, "why": "मुँह में कभी कुछ न डालें। चोट से बचाएँ, दौरे का समय नोट करें और तुरंत स्वास्थ्य सेवा तक पहुँचाएँ; बुखार के साथ मैनिनजाइटिस या मलेरिया भी सोचें।"}}, {"id": "emergency-4", "topic": "emergency", "q": "A child has swallowed kerosene stored in a soft-drink bottle. Correct first action?", "o": ["Make the child vomit immediately", "Do NOT induce vomiting; carry the container and rush to the health facility", "Give milk and send home", "Give salt water to drink"], "a": 1, "why": "Inducing vomiting after hydrocarbon (kerosene) ingestion risks aspiration into the lungs. Keep the container for identification and reach the facility quickly.", "hi": {"q": "बच्चा केरोसिन (मिट्टी का तेल) निगल गया है जो कोल्ड-ड्रिंक की बोतल में रखा था। पहला कदम?", "o": ["तुरंत उल्टी करवाएँ", "उल्टी न करवाएँ; बोतल साथ लेकर तुरंत स्वास्थ्य केंद्र पहुँचाएँ", "दूध पिलाकर घर भेज दें", "नमक-पानी दें"], "a": 1, "why": "केरोसिन के बाद उल्टी करवाने से फेफड़ों में जाने (एस्पिरेशन) का खतरा बढ़ता है। बोतल साथ ले जाएँ और जल्दी अस्पताल पहुँचें।"}}, {"id": "emergency-5", "topic": "emergency", "q": "Correct first aid for a snake bite on the leg is:", "o": ["Cut the wound and suck the venom out", "Immobilise the limb, keep it at or below heart level, remove rings/tight items, and rush to the hospital for anti-snake venom", "Apply a tight tourniquet above the bite for 2 hours", "Burn the area with a hot iron"], "a": 1, "why": "No cutting, sucking, cautery or tight tourniquets. Splint and immobilise like a fracture, keep the limb low, and reach a facility stocking anti-snake venom fast.", "hi": {"q": "पैर में साँप ने काटा है। सही प्राथमिक उपचार:", "o": ["घाव काटकर जहर चूसें", "पैर को न हिलाएँ, हृदय के स्तर तक रखें, चूड़ियाँ/चपटी चीज़ें हटाएँ और एंटी-स्नेक वेनम के लिए अस्पताल पहुँचें", "पट्टी बहुत कसकर 2 घंटे बाँधें", "घाव पर आग दबाएँ"], "a": 1, "why": "घाव काटना, चूसना या कसी पट्टी अपनाएँ नहीं। फ्रैक्चर की तरह इम्मोबिलाइज़ेशन करें और जल्दी एंटी-स्नेक वेनम वाले अस्पताल तक पहुँचें।"}}, {"id": "emergency-6", "topic": "emergency", "q": "A 10-month-old is choking on a coin and cannot cry or breathe. You should:", "o": ["Push a finger deep into the throat blindly", "Give 5 back blows with the baby face-down, then 5 chest thrusts, alternating until the object clears", "Hold the baby upside down and shake", "Wait; children cough things out themselves"], "a": 1, "why": "For infants: alternate 5 back blows and 5 chest thrusts. Blind finger sweeps can push the object deeper. Go for help if it does not clear.", "hi": {"q": "10 महीने का बच्चा सिक्का निगलने की वजह से चोक हो रहा है और रो भी नहीं पा रहा। क्या करें?", "o": ["उंगली घुसाकर ढूँढें", "बच्चे को धड़ नीचे रखकर 5 पीठ पर थपथप, फिर 5 बार छाती पर दबाव; दोहराते रहें", "उल्टा लटकाकर हिलाएँ", "इंतज़ार करें"], "a": 1, "why": "शिशुओं में 5 पीठ के प्रहार + 5 छाती दबाव दोहराएँ। अंधेरे में उंगली घुसाना वस्तु को और अंदर धकेल सकता है।"}}, {"id": "emergency-7", "topic": "emergency", "q": "First aid for a fresh burn on a child's arm is:", "o": ["Apply toothpaste or ghee", "Cool the burn under clean running water for 10-20 minutes, then cover with a clean cloth", "Ice directly on the wound", "Pop any blisters that form"], "a": 1, "why": "Cool (not ice-cold) running water for 10-20 minutes is the evidence-based first aid. Never apply toothpaste, oil or ghee and never burst blisters.", "hi": {"q": "बच्चे के हाथ पर ताज़ा जलन (बर्न) है। पहली सहायता:", "o": ["टूथपेस्ट या घी लगाएँ", "साफ बहते पानी से 10-20 मिनट ठंडा करें, फिर साफ कपड़े से ढकें", "सीधा बर्फ लगाएँ", "फफोले फोड़ें"], "a": 1, "why": "10-20 मिनट ठंडा बहता पानी प्रमाणित प्राथमिक उपचार है। टूथपेस्ट, तेल या घी न लगाएँ, फफोले न फोड़ें।"}}, {"id": "emergency-8", "topic": "emergency", "q": "Someone is rescued from a pond and is not breathing. The bystander should:", "o": ["Wait for water to drain out before any help", "Start resuscitation (open airway, rescue breaths, chest compressions) and call for help", "Only perform chest compressions and skip rescue breaths", "Turn the person upside down and run"], "a": 1, "why": "Drowning is an oxygen problem: begin airway opening, rescue breaths and compressions immediately, in parallel with calling emergency help. Do not delay for 'draining'.", "hi": null}, {"id": "emergency-9", "topic": "emergency", "q": "A person touches a live electric wire and is stuck to it. The FIRST action is:", "o": ["Pull the person away with bare hands", "Switch off the power source or use a dry wooden/non-conductive stick to separate, then assess breathing", "Pour water on the wire", "Shout and wait"], "a": 1, "why": "Never touch a person still in contact with current. Cut the supply or use a dry non-conductive object, then start resuscitation if needed and refer for burns and cardiac assessment.", "hi": null}, {"id": "emergency-10", "topic": "emergency", "q": "In an unconscious person who IS breathing, the position of choice while arranging transport is:", "o": ["Flat on the back with a pillow under the neck", "The recovery (stable side) position to keep the airway open", "Sitting upright", "Face down on the stomach"], "a": 1, "why": "The recovery position protects the airway from vomit or the tongue in any unconscious person who is breathing, while transport is arranged.", "hi": {"q": "बेहोश व्यक्ति जिसकी सांसें चल रही हैं, उसे किस स्थिति में रखें?", "o": ["तकिये के साथ पीठ के बल", "एयरवे खुला रखने के लिए साइड (रिकवरी) स्थिति में", "बैठाकर", "पेट के बल"], "a": 1, "why": "सांस चलते हुए बेहोश व्यक्ति को रिकवरी पोजीशन (करवट) में रखें ताकि उलटी या जीभ एयरवे न रोके, और शिफ्टिंग की व्यवस्था करें।"}}, {"id": "ncd-1", "topic": "ncd", "q": "A 45-year-old woman's blood pressure measures 148/94 mmHg. This reading is:", "o": ["Normal", "Elevated; she needs confirmation and management follow-up as per protocol", "Normal because she is anxious", "Only important if she has symptoms"], "a": 1, "why": "BP of 140/90 mmHg or more meets hypertension criteria. Confirm per protocol (correct technique, repeat), counsel on salt and lifestyle, and link to treatment under NPCDCS at the Health & Wellness Centre.", "hi": null}, {"id": "ncd-2", "topic": "ncd", "q": "Diabetes is diagnosed (when confirmed per protocol) with a fasting plasma glucose of:", "o": ["100 mg/dL or more", "126 mg/dL or more", "160 mg/dL or more", "200 mg/dL or more in every case"], "a": 1, "why": "Fasting plasma glucose of 126 mg/dL or more (confirmed per protocol) indicates diabetes; random glucose of 200 mg/dL with symptoms also fits. Screening is part of NCD services at HWCs.", "hi": null}, {"id": "ncd-3", "topic": "ncd", "q": "Under NPCDCS, routine screening of adults for hypertension and diabetes at Health & Wellness Centres targets people aged:", "o": ["18 years and above", "30 years and above", "45 years and above", "60 years and above"], "a": 1, "why": "India's NCD programme screens everyone 30 years and above annually for hypertension, diabetes and common cancers (oral, breast, cervical) at Ayushman Arogya Mandirs.", "hi": null}, {"id": "ncd-4", "topic": "ncd", "q": "For cervical cancer screening in women aged 30+, the field-level test used in India's programme is:", "o": ["VIA (visual inspection of the cervix with acetic acid) every 3-5 years", "A chest X-ray", "Urine culture", "Nothing exists at field level"], "a": 0, "why": "VIA by trained providers every 3-5 years from age 30 is the recommended screen-and-treat approach in the national programme, alongside HPV vaccination of girls 9-14 years.", "hi": null}, {"id": "ncd-5", "topic": "ncd", "q": "The most common early warning sign of breast cancer is:", "o": ["A painful red swelling with fever", "A painless lump in the breast or armpit", "Weight gain", "Nipple discharge only after feeding"], "a": 1, "why": "A painless lump is the classic early sign. Awareness and early reporting of any breast change sharply improve survival; advanced disease is far harder to treat.", "hi": null}, {"id": "ncd-6", "topic": "ncd", "q": "Who should be examined for oral cancer (pre-cancerous patches and ulcers)?", "o": ["Everyone under 15", "All adults 30+ who use tobacco in any form, at annual screening", "Only people with tooth decay", "Only hospital staff"], "a": 1, "why": "Annual oral visual inspection is recommended for adults 30+ who use smoked or smokeless tobacco; early lesions are treatable while advanced cancer is not.", "hi": null}, {"id": "ncd-7", "topic": "ncd", "q": "WHO recommends adults limit salt (sodium) intake to less than:", "o": ["15 grams a day", "10 grams a day", "5 grams a day", "1 gram a day"], "a": 2, "why": "Less than 5 g salt (about one teaspoon) per day lowers blood pressure and cardiovascular risk. Read labels, avoid added raw salt and pickles.", "hi": null}, {"id": "ncd-8", "topic": "ncd", "q": "Brief, structured advice from a health worker to a tobacco user:", "o": ["Has no measurable effect", "Meaningfully increases quit attempts and success and is a core HWC service", "Is pointless without a prescription", "Should wait until the user gets sick"], "a": 1, "why": "Even 3-5 minutes of brief cessation advice at every contact measurably raises quit rates; it is one of the highest-value 5-minute interventions in NCD care.", "hi": null}, {"id": "ipc-1", "topic": "ipc", "q": "Correct handwashing with soap and water should take at least:", "o": ["5 seconds", "10 seconds", "20 seconds, covering all surfaces including between fingers and thumbs", "A full minute"], "a": 2, "why": "At least 20 seconds with soap covering all hand surfaces is the standard; WHO's 5 Moments apply in clinical care.", "hi": null}, {"id": "ipc-2", "topic": "ipc", "q": "Used needles and lancets should be discarded in:", "o": ["The yellow bag", "A puncture-proof white/translucent sharps container", "The general dustbin", "A plastic bag with the regular waste"], "a": 1, "why": "Sharps go into puncture-proof containers to prevent needle-stick injuries; never recap a needle by holding it in both hands.", "hi": null}, {"id": "ipc-3", "topic": "ipc", "q": "Soiled dressings and blood-soaked cotton waste go into the:", "o": ["Yellow bag", "Blue box", "Black general bin", "Red bag"], "a": 0, "why": "Colour coding: yellow for human anatomical/soiled waste, red for contaminated recyclables, white translucent for sharps, blue for glass/metallic implants.", "hi": null}, {"id": "ipc-4", "topic": "ipc", "q": "Alcohol-based hand rub is NOT sufficient when hands are:", "o": ["Before giving an injection", "Visibly dirty or soiled", "After removing gloves", "Before touching a newborn"], "a": 1, "why": "Alcohol rub fails on visibly soiled hands and against some organisms (e.g., after caring for C. difficile); wash with soap and water in those cases.", "hi": null}, {"id": "ipc-5", "topic": "ipc", "q": "For aerosol-generating procedures on a suspected respiratory infection patient, the correct mask is:", "o": ["Cloth mask", "Surgical mask", "N95 (or equivalent respirator)", "No mask needed with good ventilation"], "a": 2, "why": "Aerosol-generating procedures require a fit-tested N95/respirator, eye protection, gown and gloves. Surgical masks suffice for routine droplet precautions.", "hi": null}, {"id": "ipc-6", "topic": "ipc", "q": "A health worker sustains a needle-stick injury. The immediate correct steps are:", "o": ["Squeeze the wound hard and continue work", "Wash with soap and running water, do not squeeze, report it and get assessed for post-exposure prophylaxis (HIV/HBV)", "Apply mud or turmeric", "Ignore it if the needle was clean"], "a": 1, "why": "Wash with soap and water, let it bleed freely, cover it, report at once and get PEP assessment. Hepatitis B vaccine status of the worker should be on record.", "hi": null}, {"id": "ipc-7", "topic": "ipc", "q": "Reuse of a needle between patients:", "o": ["Is acceptable if wiped with spirit", "Is never acceptable; needles are single-use", "Is fine for vaccine carriers", "Depends on the shortage"], "a": 1, "why": "Needles and lancets are single-use devices. Reuse transmits HIV and hepatitis; injection safety is a core primary-care standard.", "hi": null}, {"id": "ipc-8", "topic": "ipc", "q": "The most reliable way to break the chain of respiratory infections like TB, COVID-19 and influenza in a clinic is:", "o": ["Air fresheners and fans only", "Cough etiquette, masks for symptomatic patients, ventilation and hand hygiene together", "Scented candles", "Keeping windows shut"], "a": 1, "why": "Layered measures work: cover-the-cough etiquette, early masking of symptomatic patients, cross-ventilation and hand hygiene reduce transmission sharply.", "hi": null}];

let S = load();
function load(){
  try{ return JSON.parse(localStorage.getItem("arogyaDrill")) || fresh(); }catch(e){ return fresh(); }
}
function fresh(){ return {lang:"en",goal:10,day:"",streak:0,doneToday:0,cards:{},log:[],seen:0,correct:0}; }
function save(){ localStorage.setItem("arogyaDrill", JSON.stringify(S)); }
const DAY = 864e5;
function today(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function t(k){ return (I18N[S.lang]||I18N.en)[k] || I18N.en[k] || k; }
function card(id){ return S.cards[id]; }
function isDue(id){ const c=card(id); return !c || c.due<=Date.now(); }
function isNew(id){ return !card(id); }
function mastered(id){ const c=card(id); return c && c.reps>=3 && c.interval>=21; }
function topicStats(tp){
  const items=QUESTIONS.filter(x=>x.topic===tp);
  return {total:items.length, m:items.filter(x=>mastered(x.id)).length, due:items.filter(x=>isDue(x.id)&&!isNew(x.id)).length, fresh:items.filter(x=>isNew(x.id)).length};
}
function weakestTopic(){
  const ks=Object.keys(TOPICS);
  let best=ks[0], br=2;
  for(const k of ks){ const s=topicStats(k); const r=s.total? s.m/s.total : 0; if(r<br){br=r;best=k;} }
  return best;
}
function buildQueue(){
  const due=QUESTIONS.filter(x=>isDue(x.id)&&!isNew(x.id)).sort((a,b)=>card(a.id).due-card(b.id).due);
  let q=due.slice(0, S.goal);
  let left=S.goal-q.length;
  if(left>0){
    // new items, weakest topics first
    const newItems=QUESTIONS.filter(x=>isNew(x.id));
    newItems.sort((a,b)=> (a.topic===weakestTopic()? -1:1) - (b.topic===weakestTopic()? -1:1));
    const wk=newItems.filter(x=>x.topic===weakestTopic());
    const rest=newItems.filter(x=>x.topic!==weakestTopic());
    q=q.concat(wk.slice(0,left), rest.slice(0, Math.max(0,left-wk.length)));
  }
  return q;
}
function answer(id, ok){
  const now=Date.now();
  const c=card(id)||{reps:0,ease:2.5,interval:0,due:now};
  S.seen++;
  if(ok){
    S.correct++;
    c.reps++;
    c.interval = c.reps===1?1: c.reps===2?3: Math.max(1,Math.round(c.interval*c.ease));
    c.ease = Math.min(2.8, c.ease+0.05);
    c.due = now + c.interval*DAY;
    S.log = S.log.filter(e=>e.id!==id);
  } else {
    c.reps=0; c.ease=Math.max(1.3,c.ease-0.2); c.interval=1; c.due=now+10*60e3;
    if(!S.log.some(e=>e.id===id)) S.log.push({id,at:now});
  }
  S.cards[id]=c;
  // streak
  if(S.day!==today()){ S.day=today(); S.doneToday=0; S.streak=(S.streak||0)+1; }
  S.doneToday++;
  save();
}
function grade(){ return S.seen? Math.round(100*S.correct/S.seen)+"%":"–"; }

  document.querySelectorAll(".langbtn").forEach(b=>b.classList.toggle("on",S.lang==="hi"));
  document.getElementById("langbtn").textContent = S.lang==="hi" ? "EN / हिं" : "हिं / EN";
  document.documentElement.lang = S.lang==="hi" ? "hi":"en";
  render();
}

function show(v){
  ["today","topics","progress","about"].forEach(x=>{
    document.getElementById("view-"+x).classList.toggle("hidden",x!==v);
    document.getElementById("tab-"+x).classList.toggle("active",x===v);
  });
  window.scrollTo(0,0); render();
}

function render(){

  const dueN=QUESTIONS.filter(x=>isDue(x.id)&&!isNew(x.id)).length;

  document.getElementById("stDue").textContent=dueN;

  document.getElementById("stStreak").textContent=S.streak||0;

    ? (S.doneToday>=S.goal ? t("todayDone") : (S.goal-S.doneToday)+" "+t("qcount"))
    : "";
  document.getElementById("queueNote").textContent = t("timed");
  document.getElementById("goalSel").value=String(S.goal);
  const sb=document.getElementById("startBtn");
  sb.textContent = (S.day===today() && S.doneToday>=S.goal) ? t("startBtn")+" +" : t("startBtn");
  // topics
  const tl=document.getElementById("topicList"); tl.innerHTML="";
  for(const k of Object.keys(TOPICS)){
    const s=topicStats(k); const pct=s.total?Math.round(100*s.m/s.total):0;
    const chip = s.due? `<span class="chip due">${t("due")} ${s.due}</span>` : s.fresh? `<span class="chip new">${t("fresh")}</span>` : `<span class="chip ok">${t("master")}</span>`;
    const d=document.createElement("div"); d.className="topic";
    d.innerHTML=`<div class="em">${TOPICS[k].em}</div><div class="tx"><b>${S.lang==="hi"?TOPICS[k].hi:TOPICS[k].en}</b>
      <span>${s.m}/${s.total} ${t("master")} · ${s.total} ${t("qcount")}</span><div class="bar"><i style="width:${pct}%"></i></div></div>
      <div style="text-align:right">${chip}<button class="btn ghost small" style="margin-top:8px" onclick="drillTopic('${k}')">▶</button></div>`;
    tl.appendChild(d);
  }
  // progress
  document.getElementById("pgAcc").textContent=grade();
  document.getElementById("pgSeen").textContent=S.seen;
  document.getElementById("pgMast").textContent=QUESTIONS.filter(x=>mastered(x.id)).length;
  const ll=document.getElementById("logList");
  if(!S.log.length){ ll.innerHTML=`<div class="logrow sub">${t("noMistakes")}</div>`; document.getElementById("logBtn").style.display="none"; }
  else{
    document.getElementById("logBtn").style.display="";
    ll.innerHTML=S.log.slice().reverse().map(e=>{
      const q=QUESTIONS.find(x=>x.id===e.id); if(!q) return "";
      const cur=S.lang==="hi"&&q.hi?q.hi:q;
      return `<div class="logrow"><b>${cur.q}</b><div class="why">✔ ${cur.o[q.a]} — ${cur.why}</div></div>`;
    }).join("");
  }
}
/* ---------- drill ---------- */
let queue=[], qi=0, answered=0, session=[];
function openDrill(list){
  if(!list.length){ toast(t("noMistakes")); return; }
  queue=list; qi=0; answered=0; session=[];
  document.getElementById("drill").classList.add("open"); showQ();
}
function startToday(){
  let q=buildQueue();
  if(S.day===today() && S.doneToday>=S.goal){ // extra practice: weakest topic new
    const wk=QUESTIONS.filter(x=>x.topic===weakestTopic());
    q=wk.sort(()=>Math.random()-.5).slice(0,S.goal);
  }
  openDrill(q);
}
function drillTopic(k){
  const items=QUESTIONS.filter(x=>x.topic===k);
  const due=items.filter(x=>isDue(x.id)&&!isNew(x.id)).sort((a,b)=>card(a.id).due-card(b.id).due);
  const rest=items.filter(x=>!due.includes(x)).sort(()=>Math.random()-.5);
  openDrill(due.concat(rest).slice(0,Math.max(S.goal,10)));
}
function drillErrors(){ openDrill(S.log.map(e=>QUESTIONS.find(x=>x.id===e.id)).filter(Boolean)); }
function showQ(){
  const q=queue[qi]; const cur=S.lang==="hi"&&q.hi?q.hi:q;
  document.getElementById("dprog").style.width=(qi/queue.length*100)+"%";
  document.getElementById("dqTopic").textContent=(S.lang==="hi"?TOPICS[q.topic].hi:TOPICS[q.topic].en)+" · "+t("pick");
  document.getElementById("dqText").textContent=cur.q;
  const fb=document.getElementById("dqFb"); fb.style.display="none"; fb.className="fb";
  document.getElementById("nextBtn").classList.add("hidden");
  const box=document.getElementById("dqOpts"); box.innerHTML="";
  cur.o.forEach((opt,i)=>{
    const b=document.createElement("button"); b.className="opt";
    b.innerHTML=`<b class="k">${"ABCD"[i]}</b><span>${opt}</span>`;
    b.onclick=()=>pick(i,b); box.appendChild(b);
  });
  startTimer();
}
let timerInt=null;
function startTimer(){
  clearInterval(timerInt); let s=60;
  const el=document.getElementById("dtimer"); el.textContent="1:00"; el.style.color="var(--muted)";
  timerInt=setInterval(()=>{ s--; el.textContent="0:"+String(s).padStart(2,"0");
    if(s<=10) el.style.color="var(--red)";
    if(s<=0){ clearInterval(timerInt); el.textContent="0:00"; } },1000);
}
function pick(i,btn){
  clearInterval(timerInt);
  const q=queue[qi]; const cur=S.lang==="hi"&&q.hi?q.hi:q;
  const ok=i===cur.a;
  document.querySelectorAll("#dqOpts .opt").forEach((b,j)=>{
    b.disabled=true;
    if(j===cur.a) b.classList.add("correct");
    else if(j===i) b.classList.add("wrong");
  });
  answer(q.id, ok); answered++;
  const fb=document.getElementById("dqFb");
  fb.className="fb "+(ok?"good":"bad"); fb.style.display="block";
  fb.innerHTML=`<div class="ttl">${ok?"✓ "+t("correct"):"✕ "+t("wrong")}</div>${cur.why}`;
  const nb=document.getElementById("nextBtn"); nb.classList.remove("hidden");
  nb.textContent = qi+1<queue.length ? t("next") : "🏁 "+t("done");
  nb.focus();
}
function nextQ(){
  if(qi+1<queue.length){ qi++; showQ(); }
  else{ endDrill(); }
}
function endDrill(){
  document.getElementById("drill").classList.remove("open");
  clearInterval(timerInt);
  show("progress");
  if(answered) toast(t("done"));
}
/* init */
document.getElementById("goalSel").addEventListener("change",e=>{ S.goal=parseInt(e.target.value); save(); render(); });
applyLang();
</script>
